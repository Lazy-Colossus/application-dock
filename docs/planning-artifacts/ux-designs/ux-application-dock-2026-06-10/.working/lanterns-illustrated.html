<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hotaru — Stone Lantern Illustration Studies</title>
<style>
  /*
    PALETTE (muted, flat-illustration, traditional Japanese twilight)
    ----------------------------------------------------------------
    Twilight sky deep indigo .... #1b2347
    Twilight sky upper teal ..... #243a4d / #2c5560
    Twilight sky glow band ...... #3a4a6b
    Granite slate grey (lit) .... #8a8f96
    Granite slate grey (mid) .... #6f747c
    Granite slate grey (shadow) . #4f535b
    Moss green cap (light) ...... #7d9460
    Moss green cap (dark) ....... #566b3f
    Moss flecks ................. #8aa05f
    Warm amber light (core) ..... #ffd98a
    Warm amber light (mid) ...... #ffb24d
    Warm amber light (edge) ..... #e8842a
    Firefly glow yellow-green ... #d6f17a / #b8e85a
    Bamboo/pine silhouette ...... #16203a / #0f2030
    Forest floor ................ #1f2a3a / #28323f
  */

  :root {
    --bg: #11152b;
    --panel: #1a2138;
    --ink: #c9d2e6;
    --ink-dim: #7e89a6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at 50% 0%, #1c2444 0%, #11152b 70%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    text-align: center;
    padding: 2.4rem 1rem 0.6rem;
  }
  header h1 {
    font-weight: 600;
    font-size: 1.35rem;
    letter-spacing: 0.04em;
    margin: 0 0 0.35rem;
  }
  header p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 1.6rem;
    max-width: 1320px;
    margin: 2rem auto;
    padding: 0 1.4rem 3rem;
  }

  figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .scene {
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    display: block;
  }
  .scene svg { display: block; width: 100%; height: 100%; }

  figcaption {
    margin-top: 0.85rem;
    text-align: center;
    line-height: 1.35;
  }
  .num {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    color: #ffb24d;
    letter-spacing: 0.12em;
  }
  .desc {
    display: block;
    font-size: 0.82rem;
    color: var(--ink-dim);
    margin-top: 0.15rem;
  }

  /* ---- Firefly + glow animation (pure CSS) ---- */
  .firefly { transform-box: fill-box; transform-origin: center; }
  .ff-glow { animation: ffpulse 3.4s ease-in-out infinite; }
  .ff-core { animation: ffpulse 3.4s ease-in-out infinite; }
  .drift-a { animation: driftA 9s ease-in-out infinite; }
  .drift-b { animation: driftB 11s ease-in-out infinite; }
  .drift-c { animation: driftC 13s ease-in-out infinite; }
  .lantern-glow { animation: lanternBreathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  @keyframes ffpulse {
    0%, 100% { opacity: 0.25; }
    45%      { opacity: 1; }
    70%      { opacity: 0.55; }
  }
  @keyframes driftA {
    0%, 100% { transform: translate(0, 0); }
    33%      { transform: translate(10px, -14px); }
    66%      { transform: translate(-8px, -6px); }
  }
  @keyframes driftB {
    0%, 100% { transform: translate(0, 0); }
    40%      { transform: translate(-12px, -10px); }
    75%      { transform: translate(9px, -18px); }
  }
  @keyframes driftC {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(14px, -12px); }
  }
  @keyframes lanternBreathe {
    0%, 100% { opacity: 0.82; }
    50%      { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ff-glow, .ff-core, .drift-a, .drift-b, .drift-c, .lantern-glow {
      animation: none !important;
    }
    .ff-glow, .ff-core { opacity: 0.85; }
  }
</style>
</head>
<body>
<header>
  <h1>Hotaru — Stone Lantern Illustration Studies</h1>
  <p>Five flat-illustration directions of a yukimi-dōrō at summer twilight</p>
</header>

<main class="gallery">

  <!-- =================================================================
       SCENE 1 — FAITHFUL BRIEF
       ================================================================= -->
  <figure>
    <div class="scene">
      <svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stone lantern in a twilight forest, faithful rendering">
        <defs>
          <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#2c5560"/>
            <stop offset="38%" stop-color="#243a4d"/>
            <stop offset="100%" stop-color="#1b2347"/>
          </linearGradient>
          <radialGradient id="skyglow1" cx="50%" cy="62%" r="55%">
            <stop offset="0%"  stop-color="#3a4a6b" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#3a4a6b" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="granite1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#8a8f96"/>
            <stop offset="55%" stop-color="#6f747c"/>
            <stop offset="100%" stop-color="#4f535b"/>
          </linearGradient>
          <linearGradient id="cap1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#7d9460"/>
            <stop offset="100%" stop-color="#566b3f"/>
          </linearGradient>
          <radialGradient id="amber1" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#ffd98a"/>
            <stop offset="45%" stop-color="#ffb24d"/>
            <stop offset="100%" stop-color="#e8842a" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="bigglow1" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#ffb24d" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#ffb24d" stop-opacity="0"/>
          </radialGradient>
          <filter id="soft1" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6"/>
          </filter>
          <filter id="ffblur1" x="-120%" y="-120%" width="340%" height="340%">
            <feGaussianBlur stdDeviation="4"/>
          </filter>
        </defs>

        <!-- sky -->
        <rect width="400" height="600" fill="url(#sky1)"/>
        <rect width="400" height="600" fill="url(#skyglow1)"/>

        <!-- midground: silhouetted bamboo + pine -->
        <g fill="#16203a">
          <path d="M40 600 C 36 420 44 300 38 180 C 36 120 46 70 42 20 L 56 20 C 52 80 60 130 58 200 C 56 320 60 460 62 600 Z"/>
          <path d="M70 600 C 74 440 66 340 72 230 L 84 230 C 80 350 86 470 84 600 Z"/>
          <path d="M348 600 C 352 410 344 290 350 160 C 352 110 346 60 352 14 L 366 14 C 360 70 368 130 364 220 C 360 360 366 470 370 600 Z"/>
          <path d="M320 600 C 322 470 316 380 322 280 L 332 280 C 328 400 334 500 332 600 Z"/>
          <!-- bamboo nodes -->
          <rect x="36" y="120" width="22" height="5" rx="2.5"/>
          <rect x="34" y="230" width="26" height="5" rx="2.5"/>
          <rect x="348" y="110" width="20" height="5" rx="2.5"/>
          <rect x="346" y="240" width="24" height="5" rx="2.5"/>
        </g>
        <!-- distant pine boughs -->
        <g fill="#0f2030" opacity="0.85">
          <path d="M0 110 q 60 -22 120 6 q -50 -4 -120 22 Z"/>
          <path d="M400 80 q -70 -20 -140 8 q 60 -2 140 26 Z"/>
          <path d="M400 200 q -55 -16 -110 6 q 48 0 110 22 Z"/>
        </g>

        <!-- forest floor -->
        <path d="M0 470 C 120 452 280 452 400 472 L 400 600 L 0 600 Z" fill="#1f2a3a"/>
        <path d="M0 510 C 130 496 270 498 400 512 L 400 600 L 0 600 Z" fill="#28323f"/>

        <!-- ambient lantern glow on the ground -->
        <ellipse cx="200" cy="430" rx="150" ry="120" fill="url(#bigglow1)" class="lantern-glow"/>

        <!-- ===== LANTERN (yukimi-dōrō, organic hand-drawn outlines) ===== -->
        <g>
          <!-- legs: short, splayed, curved -->
          <path d="M150 470 C 146 446 150 422 162 414 C 152 432 156 456 168 472 Z" fill="url(#granite1)"/>
          <path d="M250 470 C 254 446 250 422 238 414 C 248 432 244 456 232 472 Z" fill="url(#granite1)"/>
          <path d="M196 472 C 194 450 196 426 200 414 C 204 426 206 450 204 472 Z" fill="#5a5f67"/>

          <!-- fire box: broad, soft rounded, slightly asymmetric -->
          <path d="M138 414
                   C 134 392 136 366 150 354
                   C 172 346 230 346 252 356
                   C 264 368 266 392 262 414
                   C 232 422 168 422 138 414 Z" fill="url(#granite1)"/>
          <!-- glow halo behind openings -->
          <ellipse cx="200" cy="384" rx="62" ry="46" fill="url(#bigglow1)" filter="url(#soft1)" class="lantern-glow"/>
          <!-- arched openings emitting amber -->
          <path d="M168 408 C 166 386 174 366 190 362 C 184 380 184 396 188 410 Z" fill="url(#amber1)"/>
          <ellipse cx="200" cy="384" rx="22" ry="28" fill="url(#amber1)"/>
          <path d="M232 408 C 234 386 226 366 210 362 C 216 380 216 396 212 410 Z" fill="url(#amber1)"/>
          <ellipse cx="200" cy="384" rx="11" ry="15" fill="#fff2cf"/>

          <!-- umbrella roof: wide gently curved, weathered edge -->
          <path d="M120 356
                   C 122 340 140 330 162 326
                   C 142 318 132 306 138 296
                   C 168 286 232 286 262 296
                   C 268 306 258 318 238 326
                   C 260 330 278 340 280 356
                   C 240 366 160 366 120 356 Z" fill="url(#granite1)"/>
          <!-- mossy cap on roof -->
          <path d="M174 300
                   C 170 290 178 282 192 280
                   C 208 278 224 282 226 294
                   C 214 300 188 302 174 300 Z" fill="url(#cap1)"/>
          <!-- finial -->
          <path d="M196 280 C 194 270 198 262 200 258 C 202 262 206 270 204 280 Z" fill="#566b3f"/>
          <!-- moss flecks -->
          <circle cx="150" cy="352" r="3" fill="#8aa05f" opacity="0.7"/>
          <circle cx="252" cy="350" r="2.5" fill="#8aa05f" opacity="0.6"/>
          <circle cx="142" cy="408" r="2.5" fill="#7d9460" opacity="0.6"/>
        </g>

        <!-- fireflies -->
        <g class="firefly drift-a">
          <circle class="ff-glow" cx="300" cy="320" r="13" fill="#b8e85a" opacity="0.4" filter="url(#ffblur1)"/>
          <circle class="ff-core" cx="300" cy="320" r="2.6" fill="#d6f17a"/>
        </g>
        <g class="firefly drift-b">
          <circle class="ff-glow" cx="110" cy="280" r="11" fill="#b8e85a" opacity="0.4" filter="url(#ffblur1)"/>
          <circle class="ff-core" cx="110" cy="280" r="2.3" fill="#d6f17a"/>
        </g>
        <g class="firefly drift-c">
          <circle class="ff-glow" cx="260" cy="240" r="10" fill="#b8e85a" opacity="0.4" filter="url(#ffblur1)"/>
          <circle class="ff-core" cx="260" cy="240" r="2.1" fill="#d6f17a"/>
        </g>
        <g class="firefly drift-a">
          <circle class="ff-glow" cx="150" cy="200" r="9" fill="#b8e85a" opacity="0.4" filter="url(#ffblur1)"/>
          <circle class="ff-core" cx="150" cy="200" r="2" fill="#d6f17a"/>
        </g>
      </svg>
    </div>
    <figcaption>
      <span class="num">01</span>
      <span class="desc">Faithful brief — balanced, literal rendering</span>
    </figcaption>
  </figure>

  <!-- =================================================================
       SCENE 2 — ULTRA-MINIMAL
       ================================================================= -->
  <figure>
    <div class="scene">
      <svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minimal zen stone lantern at twilight">
        <defs>

          </linearGradient>
          <radialGradient id="skyglow2" cx="50%" cy="70%" r="50%">
            <stop offset="0%"  stop-color="#3a4a6b" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#3a4a6b" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="granite2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#868c93"/>
            <stop offset="100%" stop-color="#565a62"/>
          </linearGradient>
          <linearGradient id="cap2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#7d9460"/>
            <stop offset="100%" stop-color="#566b3f"/>
          </linearGradient>
          <radialGradient id="amber2" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#ffe1a0"/>
            <stop offset="50%" stop-color="#ffb24d"/>
            <stop offset="100%" stop-color="#e8842a" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="bigglow2" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#ffb24d" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#ffb24d" stop-opacity="0"/>
          </radialGradient>
          <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="7"/>
          </filter>
          <filter id="ffblur2" x="-120%" y="-120%" width="340%" height="340%">
            <feGaussianBlur stdDeviation="4"/>
          </filter>
        </defs>

        <rect width="400" height="600" fill="url(#sky2)"/>
        <rect width="400" height="600" fill="url(#skyglow2)"/>

        <!-- a single, sparse bamboo stalk -->
        <g fill="#16203a">
          <path d="M62 600 C 58 420 64 280 60 150 C 58 100 64 56 60 18 L 72 18 C 68 70 74 120 72 210 C 70 360 74 470 76 600 Z"/>
          <rect x="58" y="160" width="18" height="4" rx="2"/>
          <rect x="56" y="300" width="22" height="4" rx="2"/>
        </g>

        <!-- floor: a single soft horizon -->
        <path d="M0 500 C 140 488 260 488 400 502 L 400 600 L 0 600 Z" fill="#222d3d"/>

        <ellipse cx="208" cy="452" rx="120" ry="84" fill="url(#bigglow2)" class="lantern-glow"/>

        <!-- ===== LANTERN — simplest form ===== -->
        <g>
          <!-- short stubby curved legs -->
          <path d="M182 498 C 178 478 182 460 192 454 C 186 470 188 488 196 500 Z" fill="url(#granite2)"/>
          <path d="M226 498 C 230 478 226 460 216 454 C 222 470 220 488 212 500 Z" fill="url(#granite2)"/>

          <!-- broad soft fire box -->
          <path d="M170 454
                   C 167 432 170 408 184 400
                   C 200 394 218 394 232 402
                   C 242 412 243 434 238 454
                   C 216 460 192 460 170 454 Z" fill="url(#granite2)"/>
          <ellipse cx="204" cy="428" rx="46" ry="36" fill="url(#bigglow2)" filter="url(#soft2)" class="lantern-glow"/>
          <ellipse cx="204" cy="428" rx="19" ry="24" fill="url(#amber2)"/>
          <ellipse cx="204" cy="428" rx="9" ry="13" fill="#fff2cf"/>

          <!-- wide curved umbrella roof -->
          <path d="M156 402
                   C 158 386 178 376 204 374
                   C 230 376 250 386 252 402
                   C 220 410 188 410 156 402 Z" fill="url(#granite2)"/>
          <!-- mossy cap -->
          <path d="M186 378 C 184 370 192 364 204 363 C 216 364 224 370 222 378 C 210 382 198 382 186 378 Z" fill="url(#cap2)"/>
          <path d="M201 363 C 200 356 203 350 204 347 C 205 350 208 356 207 363 Z" fill="#566b3f"/>
        </g>

        <!-- only two fireflies -->
        <g class="firefly drift-a">
          <circle class="ff-glow" cx="280" cy="330" r="12" fill="#b8e85a" opacity="0.4" filter="url(#ffblur2)"/>
          <circle class="ff-core" cx="280" cy="330" r="2.4" fill="#d6f17a"/>
        </g>
        <g class="firefly drift-b">
          <circle class="ff-glow" cx="140" cy="370" r="10" fill="#b8e85a" opacity="0.4" filter="url(#ffblur2)"/>
          <circle class="ff-core" cx="140" cy="370" r="2.1" fill="#d6f17a"/>
        </g>
      </svg>
    </div>
    <figcaption>
      <span class="num">02</span>
      <span class="desc">Ultra-minimal — negative space, zen, two fireflies</span>
    </figcaption>
  </figure>

  <!-- =================================================================
       SCENE 3 — LUSHER FOREST
       ================================================================= -->
  <figure>
    <div class="scene">
      <svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stone lantern in a lush layered twilight forest">
        <defs>
          <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#2c5560"/>
            <stop offset="30%" stop-color="#23414d"/>
            <stop offset="70%" stop-color="#202a4c"/>
            <stop offset="100%" stop-color="#181f42"/>
          </linearGradient>
          <radialGradient id="skyglow3" cx="50%" cy="58%" r="55%">
            <stop offset="0%"  stop-color="#3a4a6b" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#3a4a6b" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="granite3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#888d94"/>
            <stop offset="55%" stop-color="#6c717a"/>
            <stop offset="100%" stop-color="#4c5058"/>
          </linearGradient>
          <linearGradient id="cap3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#7d9460"/>
            <stop offset="100%" stop-color="#4f6338"/>
          </linearGradient>
          <radialGradient id="amber3" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#ffd98a"/>
            <stop offset="45%" stop-color="#ffb24d"/>
            <stop offset="100%" stop-color="#e8842a" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="bigglow3" cx="50%" cy="50%" r="50%">

          </radialGradient>
          <filter id="soft3" x="-50%" y="-50%" width="200%" height="200%">

        </defs>

        <rect width="400" height="600" fill="url(#sky3)"/>
        <rect width="400" height="600" fill="url(#skyglow3)"/>

        <!-- far pine layer -->

          <path d="M0 600 L0 150 q 30 -40 60 -10 q 28 -34 56 0 q 30 -28 60 10 L176 600 Z"/>
          <path d="M400 600 L400 130 q -34 -42 -66 -8 q -28 -30 -56 4 q -30 -22 -58 18 L220 600 Z"/>
        </g>

        <!-- dense bamboo grove (mid layer) -->
        <g fill="#101c34">
          <path d="M30 600 C 26 400 32 260 28 120 C 26 70 32 30 28 6 L 40 6 C 36 50 42 110 40 200 C 38 360 42 480 44 600 Z"/>

          <!-- nodes -->

        <!-- pine boughs overhanging -->

        <!-- forest floor + undergrowth -->
        <path d="M0 460 C 120 442 280 442 400 462 L 400 600 L 0 600 Z" fill="#1d2838"/>

        <!-- ferns / grass tufts -->
        <g fill="#16243e">
          <path d="M70 470 q -10 -34 -2 -52 q 8 22 14 50 q 8 -28 22 -44 q -6 28 -10 48 Z"/>
          <path d="M320 478 q 8 -30 0 -48 q -8 22 -12 48 q -8 -24 -22 -38 q 6 24 12 42 Z"/>
          <path d="M250 500 q -6 -22 0 -36 q 6 16 8 36 Z"/>
        </g>

        <ellipse cx="200" cy="420" rx="150" ry="120" fill="url(#bigglow3)" class="lantern-glow"/>

        <!-- ===== LANTERN ===== -->
        <g>
          <path d="M152 462 C 148 438 152 414 164 406 C 154 424 158 448 170 464 Z" fill="url(#granite3)"/>
          <path d="M248 462 C 252 438 248 414 236 406 C 246 424 242 448 230 464 Z" fill="url(#granite3)"/>
          <path d="M198 464 C 196 442 198 418 200 406 C 202 418 204 442 202 464 Z" fill="#565b63"/>

          <path d="M138 406
                   C 134 384 136 358 150 346
                   C 172 338 230 338 252 348
                   C 264 360 266 384 262 406
                   C 232 414 168 414 138 406 Z" fill="url(#granite3)"/>
          <ellipse cx="200" cy="376" rx="62" ry="46" fill="url(#bigglow3)" filter="url(#soft3)" class="lantern-glow"/>
          <path d="M168 400 C 166 378 174 358 190 354 C 184 372 184 388 188 402 Z" fill="url(#amber3)"/>
          <ellipse cx="200" cy="376" rx="22" ry="28" fill="url(#amber3)"/>
          <path d="M232 400 C 234 378 226 358 210 354 C 216 372 216 388 212 402 Z" fill="url(#amber3)"/>
          <ellipse cx="200" cy="376" rx="11" ry="15" fill="#fff2cf"/>

          <path d="M120 348
                   C 122 332 140 322 162 318
                   C 142 310 132 298 138 288
                   C 168 278 232 278 262 288
                   C 268 298 258 310 238 318
                   C 260 322 278 332 280 348
                   C 240 358 160 358 120 348 Z" fill="url(#granite3)"/>
          <path d="M172 292 C 168 282 176 274 192 272 C 210 270 226 276 226 288 C 212 294 186 296 172 292 Z" fill="url(#cap3)"/>
          <path d="M196 272 C 194 262 198 254 200 250 C 202 254 206 262 204 272 Z" fill="#4f6338"/>
          <circle cx="148" cy="344" r="3" fill="#8aa05f" opacity="0.7"/>
          <circle cx="254" cy="342" r="2.6" fill="#8aa05f" opacity="0.6"/>
          <circle cx="140" cy="400" r="2.6" fill="#7d9460" opacity="0.6"/>
          <circle cx="258" cy="398" r="2.2" fill="#7d9460" opacity="0.5"/>
