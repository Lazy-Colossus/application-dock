<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hotaru — Home / Identity · Neon Yūgure</title>
<style>
  :root{
    --night-0:#04060f; --night-1:#090b1e;
    --glass:rgba(20,18,52,0.55);
    --cyan:#38f0e6; --cyan-bright:#7ff7ee; --cyan-on:#03121a;
    --magenta:#ff5cc8; --violet:#9b6bff; --amber:#ffce5c;
    --ink-hi:#f1f0ff; --ink-mid:#b3aede; --ink-lo:#6f6aa0;
    --r:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(130% 80% at 50% -5%,#1a1148 0%,#0a0a24 45%,var(--night-0) 100%);
    min-height:100vh;color:var(--ink-hi);
    display:flex;flex-direction:column;align-items:center;
    padding:40px 16px 60px;
  }

  /* ── phone frame ───────────────────────────────────────────────────── */
  .phone{
    position:relative;width:360px;height:740px;border-radius:42px;
    background:linear-gradient(170deg,var(--night-1),#06061a);
    border:1px solid rgba(155,107,255,.25);
    box-shadow:0 0 0 9px #030310,0 24px 70px rgba(0,0,0,.8),
               0 0 70px rgba(155,107,255,.16),0 0 40px rgba(56,240,230,.1);
    overflow:hidden;
  }
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:#030310;border-radius:14px;z-index:30}
  .label-pill{position:absolute;top:-12px;left:50%;transform:translateX(-50%);
    background:var(--magenta);color:#2c0020;font-size:11px;font-weight:700;
    padding:4px 12px;border-radius:999px;letter-spacing:.04em;z-index:40;white-space:nowrap;
    box-shadow:0 0 20px rgba(255,92,200,.6)}
  .screen{position:absolute;inset:0;padding:46px 18px 22px;display:flex;flex-direction:column;overflow:hidden}

  /* ── fireflies (pure CSS) ──────────────────────────────────────────── */
  .ff{position:absolute;width:7px;height:7px;border-radius:50%;
    background:radial-gradient(circle,var(--amber) 0%,rgba(255,206,92,.5) 38%,transparent 70%);
    filter:blur(.2px);pointer-events:none;z-index:5;opacity:0}
  .ff.cyan{background:radial-gradient(circle,var(--cyan) 0%,rgba(56,240,230,.45) 40%,transparent 70%)}
  .ff.mag{background:radial-gradient(circle,var(--magenta) 0%,rgba(255,92,200,.45) 40%,transparent 70%)}
  .ff1{top:60%;left:12%;animation:drift1 13s ease-in-out infinite,glow 3s ease-in-out infinite}
  .ff2{top:28%;left:76%;animation:drift2 16s ease-in-out infinite,glow 3.8s ease-in-out infinite .5s}
  .ff3{top:80%;left:58%;animation:drift3 15s ease-in-out infinite,glow 3.4s ease-in-out infinite 1s}
  .ff4{top:18%;left:28%;animation:drift1 18s ease-in-out infinite reverse,glow 4.4s ease-in-out infinite .2s}
  .ff5{top:48%;left:86%;animation:drift2 14s ease-in-out infinite,glow 4s ease-in-out infinite 1.6s}
  .ff6{top:70%;left:40%;animation:drift3 17s ease-in-out infinite reverse,glow 3.2s ease-in-out infinite 2.2s}
  .ff7{top:38%;left:50%;animation:drift1 12s ease-in-out infinite,glow 2.8s ease-in-out infinite .9s}
  @keyframes drift1{0%{transform:translate(0,0)}25%{transform:translate(28px,-34px)}50%{transform:translate(10px,-60px)}75%{transform:translate(-26px,-28px)}100%{transform:translate(0,0)}}
  @keyframes drift2{0%{transform:translate(0,0)}33%{transform:translate(-34px,26px)}66%{transform:translate(20px,46px)}100%{transform:translate(0,0)}}
  @keyframes drift3{0%{transform:translate(0,0)}40%{transform:translate(28px,22px)}80%{transform:translate(-20px,-26px)}100%{transform:translate(0,0)}}
  @keyframes glow{0%,100%{opacity:.18;transform:scale(.65)}50%{opacity:1;transform:scale(1.4)}}
  @media (prefers-reduced-motion: reduce){
    .ff{animation:none !important;opacity:.42;transform:none !important}
  }

  /* ── top bar ───────────────────────────────────────────────────────── */
  .topbar{display:flex;align-items:center;justify-content:space-between;z-index:10;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;letter-spacing:.02em}
  .brand .kanji{font-size:22px;color:var(--cyan);text-shadow:0 0 16px rgba(56,240,230,.8)}
  .avatar{width:38px;height:38px;border-radius:9999px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:var(--ink-hi);cursor:pointer;
    background:var(--violet);border:2px solid rgba(241,240,255,.5);
    box-shadow:0 0 18px rgba(155,107,255,.7)}

  /* ── centre brand block ────────────────────────────────────────────── */
  .content{position:relative;z-index:10;flex:1;display:flex;flex-direction:column}
  .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
  .hero .glyph{font-size:72px;line-height:1;color:var(--cyan);
    text-shadow:0 0 40px rgba(56,240,230,.75),0 0 18px rgba(56,240,230,.6)}
  .hero .title{font-size:34px;font-weight:700;letter-spacing:.03em;color:var(--cyan);
    text-shadow:0 0 26px rgba(56,240,230,.55)}
  .hero .tag{font-size:15px;color:var(--ink-mid)}

  /* ── action buttons ────────────────────────────────────────────────── */
  .actions{display:flex;flex-direction:column;gap:14px;margin-top:8px}
  .btn{width:100%;border-radius:9999px;padding:16px 20px;font-size:16px;font-weight:700;
    cursor:pointer;text-align:center}
  .btn.primary{border:none;color:var(--cyan-on);
    background:linear-gradient(90deg,var(--cyan),var(--cyan-bright));
    box-shadow:0 0 34px rgba(56,240,230,.7)}
  .btn.secondary{background:transparent;color:var(--ink-hi);
    border:1.5px solid rgba(155,107,255,.7);
    box-shadow:0 0 22px rgba(155,107,255,.18)}
</style>
</head>
<body>
  <div class="phone">
    <div class="label-pill">HERO · Home / Identity</div>
    <div class="notch"></div>
    <span class="ff ff1"></span><span class="ff cyan ff2"></span><span class="ff mag ff3"></span>
    <span class="ff cyan ff4"></span><span class="ff ff5"></span><span class="ff mag ff6"></span><span class="ff ff7"></span>
    <div class="screen">
      <div class="topbar">
        <div class="brand"><span class="kanji">蛍</span> Hotaru</div>
        <span class="avatar">D</span>
      </div>

      <div class="content">
        <div class="hero">
          <span class="glyph">蛍</span>
          <div class="title">Hotaru</div>
          <div class="tag">Welcome back, Dani</div>
        </div>

        <div class="actions">
          <button class="btn primary">Practice ✦</button>
          <button class="btn secondary">Library</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
