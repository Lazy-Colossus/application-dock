services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: application-dock:latest
    container_name: application-dock
    restart: unless-stopped
    ports:
      - "8123:8000"
    environment:
      DATA_DIR: /data
      HOST_SCRIPTS_DIR_ON_HOST: ${HOST_SCRIPTS_DIR:-/home/jake/scripts}
      HOST_PROJECT_DIR_ON_HOST: ${HOST_PROJECT_DIR:-}
      HOST_COMPOSE_FILE_DIR_ON_HOST: ${HOST_COMPOSE_FILE_DIR:-}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      # KDH: comma-separated guest accounts (vote-only). Every other dock user
      # is an admin. The fallback MUST mirror the app default — `${KDH_GUESTS:-}`
      # would pass an empty string, which overrides that default and silently
      # promotes the shared account to admin.
      KDH_GUESTS: ${KDH_GUESTS:-players}
    volumes:
      - archery-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_SCRIPTS_DIR:-/home/jake/scripts}:/host-scripts:ro

volumes:
  archery-data:
