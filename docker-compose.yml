services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: application-dock:latest
    container_name: application-dock
    restart: unless-stopped
    ports:
      - "8123:8000"
    environment:
      DATA_DIR: /data
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      HOST_SCRIPTS_DIR_ON_HOST: ${HOST_SCRIPTS_DIR:-/home/jake/scripts}
      HOST_PROJECT_DIR_ON_HOST: ${HOST_PROJECT_DIR:-}
      HOST_COMPOSE_FILE_DIR_ON_HOST: ${HOST_COMPOSE_FILE_DIR:-}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      # Tea Cabinet AI helpers. Unset = the feature answers 503; nothing else changes.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Kalendariq: comma-separated guest accounts (vote-only). Every other dock user
      # is an admin. The fallback MUST mirror the app default — `${KALENDARIQ_GUESTS:-}`
      # would pass an empty string, which overrides that default and silently
      # promotes the shared account to admin.
      KALENDARIQ_GUESTS: ${KALENDARIQ_GUESTS:-players}
      # CubeCoders AMP (ADS controller). Unset username/password = the AMP app
      # answers 503; nothing else changes. AMP_PUBLIC_IP feeds the copy-link button.
      AMP_BASE_URL: ${AMP_BASE_URL:-http://localhost:8080}
      AMP_USERNAME: ${AMP_USERNAME:-}
      AMP_PASSWORD: ${AMP_PASSWORD:-}
      AMP_PUBLIC_IP: ${AMP_PUBLIC_IP:-}
      # Per-user app allowlist. The fallback MUST mirror the app default — a bare
      # `${APP_ACCESS:-}` passes an empty string, which drops every restriction and
      # silently grants listed users access to all apps.
      APP_ACCESS: ${APP_ACCESS:-peto:archery,iss-vanguard,floor-planner;patus:archery,iss-vanguard,floor-planner}
    volumes:
      - dock-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_SCRIPTS_DIR:-/home/jake/scripts}:/host-scripts:ro

volumes:
  dock-data:
